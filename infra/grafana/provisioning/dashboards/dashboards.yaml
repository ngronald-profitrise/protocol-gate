# Grafana dashboard provider. Loads every JSON dashboard from the mounted folder.
apiVersion: 1

providers:
  - name: protocol-gate
    orgId: 1
    folder: Protocol Gate
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
