# Prometheus scrape configuration for the Protocol Gate stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: protocol-gate

scrape_configs:
  # The gate service exposes /metrics via prometheus_client.
  - job_name: gate-api
    metrics_path: /metrics
    static_configs:
      - targets: ["gate-api:8000"]
        labels:
          component: gate

  # Prometheus scrapes itself for meta-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry collector's own metrics + anything it re-exports.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel
