# Benchmark suite configuration.
# Each run executes every scenario against both arms; iterations control how many
# passes are made to build stable latency distributions.
iterations: 20

arms:
  - control
  - experiment

scenarios:
  - name: happy_path
    weight: 1
    attack: false
  - name: replay_attack
    weight: 1
    attack: true
  - name: prompt_injection
    weight: 1
    attack: true
  - name: authority_escalation
    weight: 1
    attack: true
  - name: state_confusion
    weight: 1
    attack: true
  - name: malformed_proposal
    weight: 1
    attack: true

# Thresholds enforced by the benchmark job. The gated arm must have ZERO
# security failures; the control arm is expected to fail the attack scenarios.
thresholds:
  experiment_max_security_failures: 0
  experiment_min_acceptance_happy_path: 1
