[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "protocol-gate"
version = "0.1.0"
description = "A verified semantic protocol harness: the LLM proposes, a deterministic gate decides."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ronald", email = "ronald@ronald.ng" }]
keywords = [
    "llm",
    "security",
    "protocol",
    "state-machine",
    "formal-verification",
    "observability",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "ollama>=0.3",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.4",
    "types-PyYAML>=6.0",
]
bench = [
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/ngronald-profitrise/protocol-gate"
Repository = "https://github.com/ngronald-profitrise/protocol-gate"
Issues = "https://github.com/ngronald-profitrise/protocol-gate/issues"

[project.scripts]
protocol-gate-bench = "benchmarks.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/protocol_gate", "src/adapters", "src/harness", "src/specs", "src/api"]

[tool.hatch.build.targets.wheel.force-include]
"src/specs/task_protocol.yaml" = "specs/task_protocol.yaml"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests spanning multiple components",
    "property: property-based (hypothesis) tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "experiments", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI dependency-injection defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["ollama.*", "mlflow.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
