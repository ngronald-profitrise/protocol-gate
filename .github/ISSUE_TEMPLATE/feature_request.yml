name: Feature request
description: Suggest an enhancement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: guarantee
    attributes:
      label: Compatibility with the guarantee
      options:
        - label: This feature preserves fail-closed behavior and the audit contract.
          required: true
