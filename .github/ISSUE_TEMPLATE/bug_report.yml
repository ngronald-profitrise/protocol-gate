name: Bug report
description: Report a defect in Protocol Gate
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! For **security vulnerabilities**, do not use this form — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: When I submit ... the gate ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Ideally a failing test or a minimal scenario.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or commit sha
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - kernel (protocol_gate)
        - adapters
        - scrubber
        - harness / ollama
        - api
        - experiments / benchmarks
        - infra / observability
        - docs
        - other
    validations:
      required: true
  - type: checkboxes
    id: guarantee
    attributes:
      label: Guarantee impact
      options:
        - label: This bug could allow an effect without an accepted transition (fail-open).
        - label: This bug could cause a missing audit record.
