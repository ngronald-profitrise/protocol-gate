name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-spine:
    name: Verify document spine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check required documents exist
        run: |
          set -euo pipefail
          required=(
            README.md PRD.md TRD.md DESIGN.md WIREFRAME.md AGENTS.md CLAUDE.md
            CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md
            LICENSE NOTICE
            docs/index.md
            docs/architecture/principles.md docs/architecture/vision.md
            docs/architecture/roadmap.md docs/architecture/building-blocks.md
            docs/adr/README.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing
      - name: Check ADRs are numbered
        run: |
          set -euo pipefail
          count=$(ls docs/adr/[0-9][0-9][0-9][0-9]-*.md 2>/dev/null | wc -l)
          echo "Found $count ADR files"
          test "$count" -ge 1

  markdown-lint:
    name: Markdown lint (basic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check for tabs and trailing whitespace in Markdown
        run: |
          set -euo pipefail
          # Fail if any Markdown file contains a literal tab character.
          if grep -rIlP "\t" --include="*.md" . ; then
            echo "::warning::Markdown files should use spaces, not tabs (non-blocking)"
          fi
          echo "Markdown basic checks complete."
